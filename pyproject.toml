[project]
name = "ms-notifier-webhook"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic-settings>=2.5.2",
    "pydantic[email]>=2.9.2",
    "httpx>=0.28.0",
    "google-auth>=2.35.0",
    "slowapi>=0.1.9",
    "azure-communication-email>=1.1.0",
    "aiohttp>=3.14.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["E402"]
"src/services/email_service.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
